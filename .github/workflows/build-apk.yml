name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Android project directory
        id: locate_project
        run: |
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "./app/applet/settings.gradle.kts" ] || [ -f "./app/applet/settings.gradle" ]; then
            PROJECT_DIR="./app/applet"
          else
            SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            else
              PROJECT_DIR="."
            fi
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Detected Android project root at: $PROJECT_DIR"

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          RAW_VERSION=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version string: $RAW_VERSION"
          MAJOR_VERSION=$(echo "$RAW_VERSION" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to detect active Java major version."
            exit 1
          fi
          echo "Active Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found: $MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified successfully: Java $MAJOR_VERSION"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Create temporary debug keystore
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Run unit tests
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon
          else
            gradle :app:testDebugUnitTest --stacktrace --no-daemon
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify the APK
        id: verify_apk
        run: |
          PROJECT_DIR="${{ steps.locate_project.outputs.project_dir }}"
          EXPECTED_APK="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Primary path not found. Searching for app-debug.apk..."
            DISCOVERED_APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -n 1)
            if [ -n "$DISCOVERED_APK" ]; then
              EXPECTED_APK="$DISCOVERED_APK"
            fi
          fi
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            if [ -d "${PROJECT_DIR}/app/build/outputs/apk" ]; then
              echo "Discovered APK files in ${PROJECT_DIR}/app/build/outputs/apk:"
              find "${PROJECT_DIR}/app/build/outputs/apk" -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: Expected debug APK does not have .apk extension."
            exit 1
          fi
          echo "apk_path=$EXPECTED_APK" >> "$GITHUB_OUTPUT"
          echo "Verified APK: $EXPECTED_APK ($(stat -c "%s bytes" "$EXPECTED_APK"))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: warn

      - name: Prepare APK release asset
        id: prepare_asset
        if: always() && steps.verify_apk.outcome == 'success'
        run: |
          RELEASE_DIR="${RUNNER_TEMP:-/tmp}/apk_release_${{ github.run_number }}_${{ github.run_attempt }}"
          mkdir -p "$RELEASE_DIR"
          
          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="universal-find"
          fi
          
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_NAME}"
          
          cp "${{ steps.verify_apk.outputs.apk_path }}" "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare non-empty release asset at $ASSET_PATH"
            exit 1
          fi
          
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_NAME at $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        if: always() && steps.prepare_asset.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi
          
          if [[ "$ASSET_NAME" != *.apk ]]; then
            echo "Error: Prepared release asset does not have .apk extension."
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat << 'EOF'
          ### Debug APK Build
          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Target**: Testing and local device installation only
          - **Notice**: This APK is NOT a Google Play production release. It is signed with a temporary debug keystore for development testing.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG and title: $TITLE"
          gh release create "$TAG" \
            "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            gh release view "$TAG" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            {
              echo "## :rocket: Debug APK Build and Release Succeeded"
              echo ""
              echo "The debug APK was built and published to GitHub Releases:"
              echo "- **Release Page**: [$TITLE]($RELEASE_URL)"
              echo "- **Direct APK Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the release page on your Android phone."
              echo ""
              echo "> **Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also stored with this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK build succeeded and the artifact named 'app-debug-apk' remains available for download."
            
            {
              echo "## :warning: Debug APK Built (Release Publishing Warning)"
              echo ""
              echo "The debug APK was successfully built and uploaded as a GitHub Actions artifact, but publishing to GitHub Releases was not completed."
              echo ""
              echo "### How to download the APK:"
              echo "1. Go to the **Summary** tab of this workflow run in GitHub Actions."
              echo "2. Under the **Artifacts** section, download the **app-debug-apk** artifact archive."
              echo "3. Extract the downloaded archive to obtain \`app-debug.apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
